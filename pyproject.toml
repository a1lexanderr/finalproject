[project]
name = "finalproject"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]
